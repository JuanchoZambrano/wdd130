<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Whitewater Rafting</title>
    <meta name="description" content="Contact page created to receive people's questions and to book appointments">
    <meta name="author" content="Juan David Zambrano">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Whitewater Rafting Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="company-data">
            <h2>White Water Rafting Company</h2>
            <h3>123 Main River Street</h3>
            <h3>Jackson Hole, Wyoming</h3>
            <h3>+1 1293029132</h3>
            <h3>whitewaterrc@site.com</h3>
        </div>
        <div class="contact-content">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11554.899547191006!2d-110.71572923379725!3d43.61226952361235!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53530fe335ea3d45%3A0x3252c9dbaac6965a!2sJackson%20Hole!5e0!3m2!1ses-419!2sco!4v1790788073648!5m2!1ses-419!2sco" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>
                <div class="form-item columns">
                    <label for="user-name">Name</label>
                    <input type="text" id="user-name" name="user-name" placeholder="Juan Zambrano" required>
                </div>
                <div class="form-item columns">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="user-email" placeholder="juan@wwr.com" required>
                </div>
                <div class="form-item columns">
                    <label for="appointment">Message Purpose</label>
                    <div class="radio-group">
                        <label for="appointment">
                            <input type="radio" name="so" id="appointment" value="appointment">
                            Set an appointment
                        </label>
                        <label for="information">
                            <input type="radio" name="so" id="information" value="information">
                            I want to know more
                        </label>
                        <label for="question">
                            <input type="radio" name="so" id="question" value="question">
                            I have a question
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4" placeholder="Type here"></textarea>
                </div>
                <div class="form-item">
                    <label for="subscribe">
                        <input type="checkbox" name="susbscribe" id="subscribe">
                        Please Subscribe me to the monthlyly newsletter
                    </label>
                    <button type="submit">Get in touch!</button>
                </div>
            </form>
        </div>
        <div class="employee-section">
            <h2>We are here to serve you</h2>
            <figure>
                <img src="images/monica-img.jpg" alt="Monica image">
                <figcaption>Monica Steward</figcaption>
            </figure>
            <figure>
                <img src="images/george-image.jpg" alt="George image">
                <figcaption>George Alvin</figcaption>
            </figure>
            <figure>
                <img src="images/luisa-img.jpg" alt="Luisa image">
                <figcaption>Luisa Gastanbide</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 💧 Whitewater Rafting 💧 Juan David Zambrano</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook-icon.svg" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin-icon.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram-icon.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
