<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <meta name="author" content="Juan David Zambrano Rengifo">
    <meta name="description" content="Quiz about HTML and CSS for week 05">
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <main>
        <h1>Basic HTML and CSS Quiz!</h1>
        <form>
            <div class="quiz-item">
                <label for="q1"><strong>1.</strong> What does HTML stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>
            <div class="quiz-item">
                <label for="q2"><strong>2.</strong> Describe what HTML is used for:</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div class="quiz-item">
                <label for="q3"><strong>3. </strong> Which of the following is the right way to comment a line in CSS?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one</option>
                    <option value="a">A. # Hello World</option>
                    <option value="b">B. // Hello World</option>
                    <option value="c">C. /* Hello World */</option>
                </select>
            </div>
            <div class="quiz-item">
                <label for="q4"><strong>4.</strong> Which number corresponds to BLUE in this RGB value?</label>
                <img src="images/rgb-question.png" alt="RGB(50 150 110)">
                <input type="number" name="q4" id="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>
</html>
